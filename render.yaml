# 4 U By U — Render Blueprint (recommended production host)
#
# Why Render (and not Vercel)? YouTube blocks datacenter/serverless IP ranges,
# so on Vercel the backend cannot read a video's duration or transcript
# ("Sign in to confirm you're not a bot" / RequestBlocked). Render runs on
# regular servers that YouTube does not block, so the full topic chapterizer
# works with no proxy or API key.
#
# IMPORTANT — BYOK model:
#   LLM keys (Groq / Gemini / Eraser) are NOT deploy-time env vars. Each user
#   enters them in the UI; they are Fernet-encrypted and stored in the Supabase
#   `user_settings` vault, then decrypted per request. Only the *infrastructure*
#   secrets below belong here.
services:
  - type: web
    name: 4-u-by-u-workspace
    runtime: python
    plan: free
    region: oregon
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # "private" = your personal unrestricted mode; "public" = BYOK + hard caps
      - key: APP_MODE
        value: private
      - key: PYTHON_VERSION
        value: 3.12.7

      # --- Supabase (auth + per-user encrypted key vault + workspaces) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      # --- Session & vault encryption (set once; keep stable across deploys) ---
      # Render generates a strong random JWT signing secret.
      - key: JWT_SECRET
        generateValue: true
      # Optional. If blank, the Fernet vault key is derived deterministically
      # from JWT_SECRET, so stored user keys stay decryptable across restarts.
      - key: FERNET_KEY
        sync: false

      # --- YouTube ingestion on a datacenter host ---
      # Cloud IPs (Render/Vercel/AWS/GCP) are gated by YouTube's bot check, so
      # duration + transcripts fail unless one of these is set:
      #   YOUTUBE_API_KEY  (free)  -> duration + description (metadata only)
      #   YT_COOKIES_B64   (free)  -> browser cookies for yt-dlp (metadata + transcript)
      #   YT_PROXY_URL     (paid)  -> residential proxy (full ingestion)
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YT_COOKIES_B64
        sync: false
      - key: YT_PROXY_URL
        sync: false
