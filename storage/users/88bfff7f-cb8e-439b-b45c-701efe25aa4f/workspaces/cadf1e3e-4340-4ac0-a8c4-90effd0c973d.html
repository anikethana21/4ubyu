<script>
// High-performance scroll listener to minimize workspace navbar
(function initNavbarMinimizeOnScroll() {
  function setupListener() {
    const pane = document.getElementById("handbook-pane");
    const header = document.querySelector(".handbook-header");
    if (!pane || !header) return;

    let ticking = false;
    function updateNavbar() {
      const st = pane.scrollTop;
      if (st > 40) {
        if (!header.classList.contains("minimized")) {
          header.classList.add("minimized");
        }
      } else {
        if (header.classList.contains("minimized")) {
          header.classList.remove("minimized");
        }
      }
      ticking = false;
    }

    pane.addEventListener("scroll", function() {
      if (!ticking) {
        window.requestAnimationFrame(updateNavbar);
        ticking = true;
      }
    }, { passive: true });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupListener);
  } else {
    setupListener();
  }
})();
</script>
